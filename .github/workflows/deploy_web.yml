name: 🌐 Deploy HUSH! Web to GitHub Pages (for iOS & Web Users)

on:
  push:
    branches: [ main, hush_update ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: |
          cd hush_app
          flutter pub get

      - name: 🌐 Build Web Release
        run: |
          cd hush_app
          flutter build web --release --base-href "/HUSH_wordparty/"

      - name: 🚀 Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: hush_app/build/web
          force_orphan: true
