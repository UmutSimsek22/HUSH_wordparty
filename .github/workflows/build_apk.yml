name: 🚀 Build HUSH! Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: |
          cd hush_app
          flutter pub get

      - name: 🧪 Run Tests
        run: |
          cd hush_app
          flutter test

      - name: 🏗️ Build Android Release APK
        run: |
          cd hush_app
          flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUSH-WordParty-Release-APK
          path: hush_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 📢 Publish to GitHub Releases (For Easy Mobile Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "HUSH! Android App (Son Sürüm)"
          body: "Telefondan kolayca indirmek için aşağıdaki `app-release.apk` dosyasına tıklayın!"
          files: hush_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
